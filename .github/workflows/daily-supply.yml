name: Daily RIO supply snapshot

on:
  schedule:
    - cron: "0 6 * * *"        # 06:00 UTC every day
  workflow_dispatch: {}          # manual "Run workflow" button

permissions:
  contents: write                # allow the job to commit the new snapshot

concurrency:
  group: supply-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No dependencies to install - fetch_supply.py uses only the stdlib.
      - name: Fetch + append snapshot
        run: python append_snapshot.py
        # If any chain fails on ALL its endpoints, append_snapshot.py exits 1,
        # this step goes red, nothing is committed, and GitHub notifies you.

      # Informational only. Volume is exchange-reported, never feeds the
      # integrity checks, so a failure here must NOT fail the run or block the
      # supply snapshot from being committed.
      - name: Refresh 24h volume history
        continue-on-error: true
        run: python fetch_volume.py

      # Daily KuCoin candles since Apr 2024 for the 1Y chart and the price
      # indicators. Exchange data, informational only, so a failure must not
      # block the supply snapshot.
      - name: Refresh daily price history
        continue-on-error: true
        run: python fetch_price_history.py

      # Staking yield ladder + validator health. Independent of the supply
      # count: it reads the same native LCD but nothing it produces feeds the
      # integrity checks, so a failure must not block the supply snapshot.
      - name: Refresh network stats
        continue-on-error: true
        run: python fetch_network.py

      # Every transfer of 100k+ RIO in the last 30 days, all chains. Keyless and
      # incremental (cursors live in large-transfers.json). Informational only,
      # so a failure or a slow public endpoint must never block the snapshot.
      # BNB/Ethereum/Base use the same Alchemy secrets as the weekly holder job
      # when present (a full 30-day rescan each day); without them the script
      # falls back to keyless public RPCs. Other chains are keyless either way.
      - name: Refresh large transfers
        continue-on-error: true
        timeout-minutes: 20
        env:
          ALCHEMY_BNB_URL: ${{ secrets.ALCHEMY_BNB_URL }}
          ALCHEMY_ETH_URL: ${{ secrets.ALCHEMY_ETH_URL }}
        run: python fetch_large_transfers.py

      - name: Commit snapshot if changed
        run: |
          git config user.name  "realiostats-bot"
          git config user.email "actions@users.noreply.github.com"
          FILES="supply-history.json volume-history.json price-history.json network-history.json network-validators.json large-transfers.json"
          if [ -n "$(git status --porcelain -- $FILES)" ]; then
            git add $FILES
            git commit -m "supply snapshot $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No change to the snapshot files - nothing to commit."
          fi
